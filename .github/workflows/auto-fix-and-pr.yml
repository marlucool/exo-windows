name: Auto‑Fix & PR

on:
  pull_request:
    branches: [ main ]          # adjust as needed
  push:
    branches: [ main ]
  workflow_dispatch:           # manual trigger from the Actions tab
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to check out'
        required: false
        default: 'main'

jobs:
  fix-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push commits & create PRs
      pull-requests: write    # needed to create a PR
    steps:
      # -----------------------------------------------------------------
      # 1️⃣ Checkout the repository (respect workflow_dispatch input if given)
      # -----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 2️⃣ Set up a supported Node.js version (Node 22 LTS)
      # -----------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # <-- supported LTS version
          cache: 'npm'

      # -----------------------------------------------------------------
      # 3️⃣ Install dependencies *only* if a package.json exists
      # -----------------------------------------------------------------
      - name: Install Node dependencies (if any)
        if: exists('package.json')
        run: npm ci   # change to `npm install` or `yarn`/`pnpm` if you prefer

      # -----------------------------------------------------------------
      # 4️⃣ Run your analysis/fix script (Node.js/JavaScript)
      # -----------------------------------------------------------------
      - name: Run auto‑fix script
        id: fix
        # Example: you can replace this block with any Node.js code you need.
        # For demonstration we run ESLint with --fix; if you don’t have ESLint,
        # npx will fetch it temporarily.
        env:
          # If you need to call an external API (e.g., NVIDIA Integrate), add the secret here:
          # NVIDIA_API_KEY: ${{ secrets.NVIDIA_INTEGRATE_API_KEY }}
        run: |
          # ---- Example fix step (replace with your own logic) ----
          # Run ESLint --fix on the whole repo; ignore if ESLint isn’t configured.
          npx eslint . --ext .js,.ts,.jsx,.tsx --fix || true

          # Detect whether any files were changed by the fix step.
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 5️⃣ If changes exist, commit them and push to a temporary branch
      # -----------------------------------------------------------------
      - name: Commit fixes
        if: steps.fix.outputs.no_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-fix/${{ github.run_id }}"
          git checkout -b $BRANCH
          git add -u
          git commit -m "chore: apply automatic code fixes (run ${{ github.run_id }})"
          git push origin $BRANCH

      # -----------------------------------------------------------------
      # 6️⃣ Open a Pull Request with the fixes (if any)
      # -----------------------------------------------------------------
      - name: Create PR from fixes
        if: steps.fix.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-fix/${{ github.run_id }}
          base: ${{ github.event.inputs.ref || github.ref }}
          title: "🤖 Automatic code fixes"
          body: |
            This PR was generated by the **Auto‑Fix & PR** workflow.
            It contains changes made by the automated fix step (e.g., ESLint --fix, Prettier, custom Node.js script, etc.).
          labels: |
            automated
            auto-fix
          draft: false

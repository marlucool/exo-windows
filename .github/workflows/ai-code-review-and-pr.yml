name: AI Code Review & PR

on:
  pull_request:
    branches: [ main ]          # adjust as needed
  push:
    branches: [ main ]
  workflow_dispatch:           # manual trigger from the Actions tab
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to check out'
        required: false
        default: 'main'

jobs:
  review-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to push commits & create PRs
      pull-requests: write    # needed to create a PR
    env:
      MODEL: nvidia/nemotron-3-super-120b-al2b   # model used for the review
    steps:
      # -----------------------------------------------------------------
      # 1️⃣ Checkout the repository (respect workflow_dispatch input if given)
      # -----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 2️⃣ Set up a supported Node.js version (Node 22 LTS)
      # -----------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # current LTS – avoids Node 20 deprecation warning
          cache: 'npm'

      # -----------------------------------------------------------------
      # 3️⃣ Install Node dependencies (only if a package.json exists)
      # -----------------------------------------------------------------
      - name: Install Node dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci   # change to `npm install` / `yarn` / `pnpm` if you prefer
          fi

      # -----------------------------------------------------------------
      # 4️⃣ Install jq for JSON parsing (if the API returns JSON)
      # -----------------------------------------------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # -----------------------------------------------------------------
      # 5️⃣ Package the source code (gzipped tarball) – placed in /tmp
      # -----------------------------------------------------------------
      - name: Package source code
        id: package
        run: |
          # Create tarball excluding version control directories
          tar -czf /tmp/source-code.tar.gz \
            --exclude='.git' --exclude='.svn' --exclude='.hg' --exclude='CVS' \
            --exclude='.bzr' --exclude='_darcs' .
          # Verify tarball was created and is not empty
          if [ ! -s /tmp/source-code.tar.gz ]; then
            echo "Error: source code tarball is missing or empty"
            exit 1
          fi
          echo "Tarball created: $(wc -c < /tmp/source-code.tar.gz) bytes"

      # -----------------------------------------------------------------
      # 6️⃣ CALL THE NVIDIA INTEGRATE API (JSON PAYLOAD – this is what NVIDIA NIM/Integrate expects)
      # -----------------------------------------------------------------
      - name: Invoke NVIDIA review API – JSON
        id: review
        env:
          NVIDIA_ENDPOINT: https://integrate.api.nvidia.com/v1
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_INTEGRATE_API_KEY }}
        run: |
          # Create a base64‑encoded string of the gzipped tarball
          CODE_B64=$(base64 -w 0 /tmp/source-code.tar.gz)

          # Build the JSON payload (chat‑completion format)
          read -r -d '' PAYLOAD <<EOF
          {
            "model": "${MODEL}",
            "messages": [
              {
                "role": "system",
                "content": "You are an expert code reviewer. Analyze the supplied source code and return a unified diff (git‑apply format) that fixes any bugs, security issues, or improvements you find. If no changes are needed, return an empty string."
              },
              {
                "role": "user",
                "content": "Here is the source code (base64‑gzipped tarball):\n$CODE_B64"
              }
            ],
            "temperature": 0.0,
            "max_tokens": 4096
          }
          EOF

          # Send the request and save the raw response
          curl -s -X POST "$NVIDIA_ENDPOINT" \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -o nvidia-response.json

          # Extract the assistant's message content (the diff)
          DIFF=$(jq -r '.choices[0].message.content // empty' nvidia-response.json)

          # Write the diff to a file for the next step
          echo "$DIFF" > ai-suggested.diff

          # Flag whether the diff is empty (only whitespace)
          if [[ -z "$(echo "$DIFF" | sed 's/[[:space:]]//g')" ]]; then
            echo "diff_empty=true" >> $GITHUB_OUTPUT
          else
            echo "diff_empty=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 7️⃣ Apply the AI‑generated diff (if any)
      # -----------------------------------------------------------------
      - name: Apply AI‑generated diff
        if: steps.review.outputs.diff_empty == 'false'
        id: apply
        run: |
          # Apply the diff; allow whitespace fixes
          if git apply --whitespace=fix ai-suggested.diff; then
            echo "Applied diff successfully."
          else
            # If the direct apply fails, try with --reject to see what failed
            git apply --reject ai-suggested.diff || true
            if ls *.rej 2>/dev/null | grep -q .; then
              echo "Some hunks were rejected – treating as no changes."
              exit 1
            fi
          fi

          # Detect if the working tree now has changes
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 8️⃣ Commit changes and push to a temporary branch (if any changes)
      # -----------------------------------------------------------------
      - name: Commit AI‑suggested fixes
        if: steps.apply.outputs.no_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai-review/${{ github.run_id }}"
          git checkout -b $BRANCH
          git add -u
          git commit -m "chore: apply AI‑suggested code fixes (run ${{ github.run_id }})"
          git push origin $BRANCH

      # -----------------------------------------------------------------
      # 9️⃣ Open a Pull Request with the AI‑suggested fixes
      # -----------------------------------------------------------------
      - name: Create PR from AI fixes
        if: steps.apply.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-review/${{ github.run_id }}
          base: ${{ github.event.inputs.ref || github.ref }}
          title: "🤖 AI‑generated code review & fixes"
          body: |
            This PR was created automatically by the **AI Code Review & PR** workflow.

            The model **${MODEL}** reviewed the source code and returned a unified diff, which was applied above.

            View the full AI response: [nvidia-response.json](nvidia-response.json)
          labels: |
            ai-review
            auto-fix
          draft: false
